<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Contador de Dias sem Churrasco</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding-top: 50px;
      background-color: #000000;
      color: #f5f5f7;
    }
    h1 {
      font-size: 2.5rem;
    }
    .contador {
      font-size: 4rem;
      font-weight: bold;
    }
    .sub {
      font-size: 1.2rem;
      margin-bottom: 20px;
    }
    h2 {
      margin-top: 40px;
      font-size: 1.5rem;
      color: #ffcc00; /* destaque amarelo */
    }
    ul {
      list-style: none;
      padding: 0;
      margin-top: 10px;
    }
    ul li {
      font-size: 1.2rem;
      margin: 5px 0;
    }
  </style>
</head>
<body>
  <h1>Estamos há</h1>
  <div class="contador" id="contador"></div>
  <div class="sub" id="texto"></div>

  <h2>Último patrocinio</h2>
  <ul>
    <li>Adryan - </li>
    <li>Jackson - 02/10/2025</li>
    <li>Maycon - 23/10/2025</li>
    <li>Wesney - 06/10/2025 </li>
  </ul>

  <script>
    function normalizarData(d) {
      return new Date(d.getFullYear(), d.getMonth(), d.getDate());
    }

    // Último churrasco: 14/09/2025
    const lastBBQDate = normalizarData(new Date(2025, 10, 26));

    function atualizarContador() {
      const hoje = normalizarData(new Date());
      const diffTempo = hoje - lastBBQDate;
      const diffDias = Math.floor(diffTempo / (1000 * 60 * 60 * 24));
      document.getElementById("contador").textContent = diffDias;
      document.getElementById("texto").textContent = 
        diffDias === 1 ? "dias sem reunião" : "dias sem reunião";
    }

    atualizarContador();
    setInterval(atualizarContador, 60000);
  </script>
</body>
</html>
